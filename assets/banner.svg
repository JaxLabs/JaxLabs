<path filter="url(#shadow)" fill="#d0d7be" d="M25 149 Q25 135 39 135 L167 135 Q179 135 187 145 L199 157 L1161 157 Q1175 157 1175 171 L1175 321 Q1175 335 1161 335 L39 335 Q25 335 25 321Z"/>
<rect x="25" y="157" width="1150" height="164" fill="#d0d7be" filter="url(#grain)"/>
